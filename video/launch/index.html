<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0b10;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.2"
      data-width="1920"
      data-height="1080"
    >
      <!-- one continuous piece of real product footage, cut at media offsets;
           each frame hoists its own approved video declaration -->
      <div
        class="clip"
        data-composition-id="f01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
      ></div>
      <div
        class="clip"
        data-composition-id="f02-body"
        data-composition-src="compositions/frames/02-body.html"
        data-start="3.4"
        data-duration="5.2"
        data-track-index="1"
      ></div>
      <div
        class="clip"
        data-composition-id="f03-bore"
        data-composition-src="compositions/frames/03-bore.html"
        data-start="8.6"
        data-duration="6"
        data-track-index="2"
      ></div>
      <div
        class="clip"
        data-composition-id="f04-there"
        data-composition-src="compositions/frames/04-there.html"
        data-start="14.6"
        data-duration="5.4"
        data-track-index="3"
      ></div>
      <div
        class="clip"
        data-composition-id="f05-url"
        data-composition-src="compositions/frames/05-url.html"
        data-start="20"
        data-duration="9.2"
        data-track-index="4"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // span anchor — all content lives in the sub-compositions
      tl.to({}, { duration: 29.2 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
